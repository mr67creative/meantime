version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meantime
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
  # Laya: open-source, non-chat AI sidecar for content/proof moderation.
  # Serves POST /v1/classify with { task, text?, url?, imageKey? } and returns
  # { score, labels[], confidence }. Runs fully local — nothing leaves the box.
  laya:
    image: laya/laya:latest
    ports:
      - "8080:8080"
    restart: unless-stopped
volumes:
  pgdata:
